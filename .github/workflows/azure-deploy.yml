name: Deploy Python Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/ai/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'invest-ai-backend'
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package backend for Azure
        run: |
          # Masuk ke folder backend/ai agar requirements.txt berada di root zip
          cd backend/ai
          zip -r ../../release.zip . -x "venv/*" -x "__pycache__/*" -x "*.pyc"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: release.zip
